name: Backend CI and CD

on:
  pull_request:
    branches: [main]
  push:
    branches: ["**"]
    tags: ["backend-v*.*.*"]

permissions:
  contents: read

jobs:
  verify:
    name: Check backend and build container
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: npm run check

      - name: Start MongoDB replica set for integration tests
        run: |
          docker run --detach --name qkart-mongo \
            --publish 27017:27017 \
            mongo:8.0 --replSet rs0 --bind_ip_all

          for attempt in $(seq 1 30); do
            if docker exec qkart-mongo mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' 2>/dev/null | grep -q 1; then
              break
            fi
            sleep 1
          done

          docker exec qkart-mongo mongosh --quiet --eval \
            'rs.initiate({_id: "rs0", members: [{_id: 0, host: "127.0.0.1:27017"}]})'

          for attempt in $(seq 1 30); do
            if docker exec qkart-mongo mongosh --quiet --eval 'db.hello().isWritablePrimary' 2>/dev/null | grep -q true; then
              exit 0
            fi
            sleep 1
          done

          echo "MongoDB replica set did not become primary in time."
          exit 1

      - name: Run backend integration tests
        run: npm test -- --runTestsByPath tests/integration
        env:
          NODE_ENV: test
          MONGODB_URL: mongodb://127.0.0.1:27017/qkart?replicaSet=rs0
          JWT_SECRET: ci-test-secret-with-more-than-32-characters

      - name: Build production container
        run: docker build --tag qkart-backend:ci .

  publish:
    name: Publish container to GitHub Container Registry
    needs: verify
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/backend-v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-backend
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
